<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS Analytics Dashboard</title>
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>LMS Analytics</h1>
        <p>Learning platform statistics</p>
    </header>

    <main class="container">

        <section class="summary row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <h2 id="totalStudents">0</h2>
                    <p>Students</p>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <h2 id="totalCourses">0</h2>
                    <p>Courses</p>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <h2 id="completionRate">0%</h2>
                    <p>Completion rate</p>
                </div>
            </div>
        </section>

        <section class="courses">

            <h2>Course progress</h2>
                <div class="row g-3 align-items-end">

                    <div class="col-md-3">
                        <label for="progressInput">Progreso mínimo:</label>
                        <input 
                            type="number" 
                            id="progressInput"
                            class="form-control"
                            value="80" 
                            min="0" 
                            max="100"
                        >
                    </div>

                    <div class="col-md-5">
                        <label for="searchInput">Buscar curso:</label>
                        <input 
                            type="text" 
                            id="searchInput"
                            class="form-control"
                            placeholder="Buscar curso..."
                        >
                    </div>

                </div>

                <div class="mt-3 d-flex gap-2">
                    <button id="filterButton" class="btn btn-primary">
                        Aplicar filtro
                    </button>

                    <button id="sortButton" class="btn btn-secondary">
                        Ordenar por progreso
                    </button>

                    <button id="resetButton" class="btn btn-outline-secondary">
                        Restablecer
                    </button>
                </div>
            <div id="courseList"></div>
        
        </section>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
