<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS Analytics Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>LMS Analytics</h1>
        <p>Learning platform statistics</p>
    </header>

    <main>

        <section class="summary">
            <div class="card">
                <h2 id="totalStudents">0</h2>
                <p>Students</p>
            </div>

            <div class="card">
                <h2 id="totalCourses">0</h2>
                <p>Courses</p>
            </div>

            <div class="card">
                <h2 id="completionRate">0%</h2>
                <p>Completion rate</p>
            </div>
        </section>

        <section class="courses">

            <h2>Course progress</h2>
            <label for="progressInput">Progreso mínimo:</label>
            <input 
                type="number" 
                id="progressInput" 
                value="80" 
                min="0" 
                max="100"
            >
            <button id="filterButton">Aplicar filtro</button>
            <button id="sortButton">Ordenar por progreso</button>
            <button id="resetButton">Restablecer</button>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Buscar curso..."
            >
            <div id="courseList"></div>
        
        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
