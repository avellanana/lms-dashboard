<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS Analytics Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>LMS Analytics</h1>
        <p>Learning platform statistics</p>
    </header>

    <main>

        <section class="summary">
            <div class="card">
                <h2>428</h2>
                <p>Students</p>
            </div>

            <div class="card">
                <h2>18</h2>
                <p>Courses</p>
            </div>

            <div class="card">
                <h2>76%</h2>
                <p>Completion rate</p>
            </div>
        </section>

        <section class="courses">

            <h2>Course progress</h2>
            <button id="filterButton">Mostrar cursos ≥ 80%</button>
            <button id="resetButton">Restablecer</button>
            <div id="courseList"></div>
        
        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
